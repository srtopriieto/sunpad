name: Compilar Sunpad nativo (Apple Silicon / iOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Preparar el entorno virtual
        uses: actions/checkout@v4

      - name: 2. Activar la versión más reciente de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-path: /Applications/Xcode_15.2.app

      - name: 3. Clonar repositorios de PadMint y Sunpad
        run: |
          git clone https://github.com/chrissotraidis/padmint.git padmint_core
          # O la ruta específica que emplee el motor de Sunpad para integrar dependencias

      - name: 4. Ejecutar la compilación del paquete nativo
        run: |
          cd padmint_core
          # Script de compilación o empaquetado para iOS

      - name: 5. Extraer y empaquetar el .ipa resultante
        uses: actions/upload-artifact@v4
        with:
          name: Sunpad-iOS-IPA
          path: |
            **/*.ipa
